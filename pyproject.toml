[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-guard"
version = "0.1.0"
description = "Lightweight, dependency-free data-quality validation for ETL pipelines: contracts, schema drift detection, quarantine and alerts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shalu Kumari" }]
keywords = ["data-quality", "etl", "data-contracts", "schema-drift", "data-validation", "quarantine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/s78519300-creator/data-quality-guard"
Issues = "https://github.com/s78519300-creator/data-quality-guard/issues"

[project.scripts]
dqguard = "data_quality_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Keep Optional[...] / Union[...] spelled out: the package supports Python 3.9.
ignore = ["UP007", "UP045"]
