name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v

  demo:
    name: Validate example data with the CLI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Run dqguard on examples/orders.csv
        run: |
          dqguard validate \
            --data examples/orders.csv \
            --contract examples/orders_contract.json \
            --out out/
      - name: Run dqguard on examples/events.jsonl (module entry point)
        run: |
          python -m data_quality_guard validate \
            --data examples/events.jsonl \
            --contract examples/events_contract.json \
            --out out/
      - name: Publish Markdown report to the job summary
        if: always()
        run: cat out/orders_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dqguard-example-run
          path: out/
